<!DOCTYPE html>
<html lang="en">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --primary: #7c3aed; --secondary: #8b5cf6; --accent: #a78bfa; --success: #10b981; --warning: #f59e0b; }
        * { box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: linear-gradient(135deg, #1e1b4b 0%, #312e81 50%, #4c1d95 100%); min-height: 100vh; }
        .glass { backdrop-filter: blur(20px); background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15); }
        .card { background: rgba(255,255,255,0.98); border-radius: 1rem; padding: 1.25rem; box-shadow: 0 20px 60px rgba(0,0,0,0.2); transition: all 0.3s cubic-bezier(0.4,0,0.2,1); }
        .card:hover { transform: translateY(-4px) scale(1.01); box-shadow: 0 30px 80px rgba(0,0,0,0.25); }
        .input-field { width: 100%; padding: 0.65rem 1rem; border: 2px solid #e2e8f0; border-radius: 0.75rem; font-size: 0.875rem; transition: all 0.2s; background: white; }
        .input-field:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 4px rgba(124,58,237,0.15); }
        .nav-header { background: rgba(0,0,0,0.3); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(255,255,255,0.1); }
        .category-badge { font-size: 10px; font-weight: 700; padding: 3px 8px; border-radius: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
        .equipment-card { cursor: pointer; border: 2px solid transparent; position: relative; overflow: hidden; }
        .equipment-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 4px; background: linear-gradient(90deg, var(--primary), var(--accent)); transform: scaleX(0); transition: transform 0.3s; }
        .equipment-card:hover::before { transform: scaleX(1); }
        .equipment-card:hover { border-color: var(--primary); }
        .equipment-card.selected { border-color: var(--primary); background: linear-gradient(135deg, #f5f3ff 0%, #ede9fe 100%); }
        .equipment-card.selected::before { transform: scaleX(1); }
        .star { color: #fbbf24; }
        .star.empty { color: #d1d5db; }
        .btn-primary { background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%); color: white; padding: 0.75rem 1.5rem; border-radius: 0.75rem; font-weight: 600; transition: all 0.2s; border: none; cursor: pointer; }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(124,58,237,0.4); }
        .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        .modal-overlay { animation: fadeIn 0.2s ease-out; }
        .modal-content { animation: slideUp 0.3s ease-out; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .tag { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 9999px; font-size: 11px; font-weight: 600; }
        .verified { background: #dcfce7; color: #166534; }
        .premium { background: #fef3c7; color: #92400e; }
        .tab { padding: 0.75rem 1.5rem; font-weight: 500; border-bottom: 2px solid transparent; cursor: pointer; transition: all 0.2s; }
        .tab:hover { color: var(--primary); }
        .tab.active { color: var(--primary); border-color: var(--primary); }
        @media print { body { background: white !important; } .no-print { display: none !important; } }
    </style>
</head>

                        <option value="500000-2000000">₹5-20 Lakhs</option>
                        <option value="2000000-10000000">₹20L-1 Crore</option>

                        <option value="4.5">4.5+ Stars</option>
                        <option value="4">4+ Stars</option>
                        <option value="3">3+ Stars</option>
                    </select>
                </div>

                    <i class="fas fa-undo mr-1"></i> Reset Filters

                        </div>

        { id: 63, name: 'sc1000', type: 'Universal Controller', category: 'Instrumentation', vendor: 'Hach', country: 'USA', capacity: '1-4 Sensors', accuracy: 'N/A', priceMin: 55000, priceMax: 120000, material: 'Polycarbonate IP66', leadTime: '2-3 weeks', warranty: '24 months', contact: '022-2764-3800', email: 'india@hach.com', rating: 4.5, reviews: 198, verified: true, premium: false, features: ['Universal Platform', 'Touch Screen', 'SCADA Ready'], applications: ['Multi-point monitoring', 'Panel mount'], image: 'instrument' },
        
        // VALVES & PIPING (New Category)
        { id: 70, name: 'Butterfly Valve', type: 'Manual BFV', category: 'Valves', vendor: 'Audco', country: 'India', capacity: 'DN50-1200', pressure: 'PN10/PN16', priceMin: 2000, priceMax: 150000, material: 'CI/DI/SS', leadTime: '1-2 weeks', warranty: '12 months', contact: '044-2251-4000', email: 'sales@audco.net', rating: 4.4, reviews: 534, verified: true, premium: false, features: ['ISO 5211', 'EPDM/NBR Seat', 'Wafer/Lug'], applications: ['Isolation', 'Throttling'], image: 'valve' },
        { id: 71, name: 'Electric Actuated BFV', type: 'Actuated Valve', category: 'Valves', vendor: 'Rotork', country: 'UK', capacity: 'DN50-600', pressure: 'PN16', priceMin: 25000, priceMax: 350000, material: 'CI/SS/Aluminum', leadTime: '4-6 weeks', warranty: '18 months', contact: '022-2846-1000', email: 'india@rotork.com', rating: 4.7, reviews: 167, verified: true, premium: true, features: ['IQ3 Intelligent', 'Modulating', 'Explosion Proof'], applications: ['Remote control', 'Automation'], image: 'valve' },
        { id: 72, name: 'Globe Control Valve', type: 'Control Valve', category: 'Valves', vendor: 'Fisher (Emerson)', country: 'USA', capacity: 'DN25-300', pressure: 'Class 150-600', priceMin: 80000, priceMax: 800000, material: 'WCB/SS316', leadTime: '6-10 weeks', warranty: '18 months', contact: '080-4084-0000', email: 'india@emerson.com', rating: 4.8, reviews: 89, verified: true, premium: true, features: ['Digital Positioner', 'Cage Trim', 'Low Noise'], applications: ['Flow control', 'Pressure control'], image: 'valve' }
    ];

    const CATEGORIES = [...new Set(EQUIPMENT_DB.map(e => e.category))];
    const VENDORS = [...new Set(EQUIPMENT_DB.map(e => e.vendor))];

    let selectedItems = [];
    let filteredData = [...EQUIPMENT_DB];

    document.addEventListener('DOMContentLoaded', () => {
        initFilters();
        renderEquipment();
        updateStats();

        document.getElementById('searchInput').addEventListener('input', applyFilters);
        document.getElementById('priceFilter').addEventListener('change', applyFilters);
        document.getElementById('ratingFilter').addEventListener('change', applyFilters);
        document.getElementById('sortBy').addEventListener('change', applyFilters);
        document.getElementById('compareBtn').addEventListener('click', showCompare);
    });

    function initFilters() {
        document.getElementById('categoryFilters').innerHTML = CATEGORIES.map(cat => `
            <label class="flex items-center gap-2 cursor-pointer hover:bg-gray-50 p-1 rounded">
                <input type="checkbox" value="${cat}" class="cat-filter rounded text-purple-600" checked>
                <span class="text-gray-700">${cat}</span>
                <span class="ml-auto text-xs text-gray-400">${EQUIPMENT_DB.filter(e => e.category === cat).length}</span>
            </label>
        `).join('');

        document.getElementById('vendorFilters').innerHTML = VENDORS.map(v => `
            <label class="flex items-center gap-2 cursor-pointer hover:bg-gray-50 p-1 rounded">
                <input type="checkbox" value="${v}" class="vendor-filter rounded text-purple-600" checked>
                <span class="text-gray-700 text-sm">${v}</span>
            </label>
        `).join('');

        document.querySelectorAll('.cat-filter, .vendor-filter').forEach(el => el.addEventListener('change', applyFilters));
    }

    function applyFilters() {
        const search = document.getElementById('searchInput').value.toLowerCase();
        const pr = document.getElementById('priceFilter').value;
        const rating = document.getElementById('ratingFilter').value;
        const sortBy = document.getElementById('sortBy').value;
        const cats = [...document.querySelectorAll('.cat-filter:checked')].map(e => e.value);
        const vendors = [...document.querySelectorAll('.vendor-filter:checked')].map(e => e.value);

        filteredData = EQUIPMENT_DB.filter(e => {
            const matchSearch = !search || e.name.toLowerCase().includes(search) || e.type.toLowerCase().includes(search) || e.vendor.toLowerCase().includes(search);
            const matchCat = cats.includes(e.category);
            const matchVendor = vendors.includes(e.vendor);
            let matchPrice = true;
            if (pr !== 'all') { const [min, max] = pr.split('-').map(Number); matchPrice = e.priceMax >= min && e.priceMin <= max; }
            const matchRating = rating === 'all' || e.rating >= parseFloat(rating);
            return matchSearch && matchCat && matchVendor && matchPrice && matchRating;
        });

        filteredData.sort((a, b) => {
            switch(sortBy) {
                case 'price-asc': return a.priceMin - b.priceMin;
                case 'price-desc': return b.priceMax - a.priceMax;
                case 'vendor': return a.vendor.localeCompare(b.vendor);
                case 'rating': return b.rating - a.rating;
                default: return a.name.localeCompare(b.name);
            }
        });
        renderEquipment();
    }

    function renderEquipment() {
        const fmtPrice = (min, max, unit = '') => {
            const fmt = n => n < 100 ? '₹' + n : (n < 100000 ? '₹' + (n/1000).toFixed(0) + 'K' : '₹' + (n/100000).toFixed(1) + 'L');
            return unit ? fmt(min) + '-' + fmt(max) + unit : fmt(min) + ' - ' + fmt(max);
        };
        const renderStars = r => Array(5).fill(0).map((_, i) => `<i class="fas fa-star ${i < Math.round(r) ? 'star' : 'star empty'}"></i>`).join('');
        const catColors = { Pumps: 'bg-blue-100 text-blue-700', Blowers: 'bg-emerald-100 text-emerald-700', Membranes: 'bg-purple-100 text-purple-700', Filters: 'bg-amber-100 text-amber-700', Clarifiers: 'bg-cyan-100 text-cyan-700', Chemicals: 'bg-pink-100 text-pink-700', Instrumentation: 'bg-indigo-100 text-indigo-700', Valves: 'bg-rose-100 text-rose-700' };

        document.getElementById('equipmentGrid').innerHTML = filteredData.map(e => {
            const sel = selectedItems.includes(e.id);
            return `
                <div class="card equipment-card ${sel ? 'selected' : ''}" onclick="showDetail(${e.id})">
                    <div class="flex justify-between items-start mb-3">
                        <span class="category-badge ${catColors[e.category] || 'bg-gray-100 text-gray-700'}">${e.category}</span>
                        <input type="checkbox" ${sel ? 'checked' : ''} class="w-5 h-5 rounded-md border-2 text-purple-600" onclick="event.stopPropagation(); toggleSelect(${e.id})">
                    </div>
                    <div class="flex items-center gap-2 mb-1">
                        ${e.verified ? '<span class="tag verified"><i class="fas fa-check-circle"></i></span>' : ''}
                        ${e.premium ? '<span class="tag premium"><i class="fas fa-crown"></i> Premium</span>' : ''}
                    </div>
                    <h4 class="font-bold text-gray-800 text-lg">${e.name}</h4>
                    <p class="text-sm text-gray-500 mb-2">${e.type}</p>
                    <div class="flex items-center gap-2 mb-3 flex-wrap">
                        <img src="https://ui-avatars.com/api/?name=${encodeURIComponent(e.vendor)}&background=random&size=24&rounded=true" class="w-6 h-6 rounded-full">
                        <span class="text-sm font-medium text-gray-700">${e.vendor}</span>
                        <span class="text-xs text-gray-400">${e.country}</span>
                    </div>
                    <div class="flex items-center gap-1 mb-3 text-sm">${renderStars(e.rating)}<span class="text-gray-600 ml-1">${e.rating}</span><span class="text-gray-400">(${e.reviews})</span></div>
                    <div class="text-sm text-gray-600 space-y-1 mb-3">
                        <p class="flex items-center gap-2"><i class="fas fa-tachometer-alt w-4 text-gray-400"></i> ${e.capacity}</p>
                        <p class="flex items-center gap-2"><i class="fas fa-clock w-4 text-gray-400"></i> ${e.leadTime}</p>
                    </div>
                    <div class="pt-3 border-t flex justify-between items-center">
                        <span class="text-xl font-bold text-purple-700">${fmtPrice(e.priceMin, e.priceMax, e.unit)}</span>
                        <button class="text-xs text-purple-600 hover:text-purple-800 font-semibold">View Details →</button>
                    </div>
                </div>
            `;
        }).join('');
        document.getElementById('resultCount').textContent = `Showing ${filteredData.length} of ${EQUIPMENT_DB.length} items`;
    }

    function toggleSelect(id) {
        if (selectedItems.includes(id)) selectedItems = selectedItems.filter(i => i !== id);
        else if (selectedItems.length < 4) selectedItems.push(id);
        updateCompareBtn();
        renderEquipment();
    }
    function updateCompareBtn() {
        document.getElementById('compareCount').textContent = selectedItems.length + ' selected';
        document.getElementById('compareBtn').disabled = selectedItems.length < 2;
    }
    function updateStats() {
        document.getElementById('statEquipment').textContent = EQUIPMENT_DB.length;
        document.getElementById('statVendors').textContent = VENDORS.length;
        document.getElementById('statCategories').textContent = CATEGORIES.length;
    }
    window.resetFilters = () => {
        document.getElementById('searchInput').value = '';
        document.getElementById('priceFilter').value = 'all';
        document.getElementById('ratingFilter').value = 'all';
        document.querySelectorAll('.cat-filter, .vendor-filter').forEach(c => c.checked = true);
        applyFilters();
    };
    window.toggleSelect = toggleSelect;
    window.showDetail = id => {
        const e = EQUIPMENT_DB.find(eq => eq.id === id);
        const fmtINR = n => '₹' + n.toLocaleString('en-IN');
        const renderStars = r => Array(5).fill(0).map((_, i) => `<i class="fas fa-star ${i < Math.round(r) ? 'star' : 'star empty'}"></i>`).join('');
        document.getElementById('detailContent').innerHTML = `
            <div class="bg-gradient-to-r from-purple-600 to-indigo-600 text-white p-6">
                <div class="flex justify-between items-start">
                    <div>
                        <div class="flex items-center gap-2 mb-2">
                            ${e.verified ? '<span class="tag verified"><i class="fas fa-check-circle"></i> Verified</span>' : ''}
                            ${e.premium ? '<span class="tag premium"><i class="fas fa-crown"></i> Premium</span>' : ''}
                        </div>
                        <h2 class="text-2xl font-bold">${e.name}</h2>
                        <p class="text-white/80">${e.type} by ${e.vendor}</p>
                        <div class="flex items-center gap-2 mt-2">${renderStars(e.rating)}<span class="font-bold ml-1">${e.rating}</span><span class="text-white/70">(${e.reviews} reviews)</span></div>
                    </div>
                    <button onclick="closeDetail()" class="w-10 h-10 rounded-full bg-white/20 hover:bg-white/30 flex items-center justify-center"><i class="fas fa-times"></i></button>
                </div>
            </div>
            <div class="p-6 grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <h3 class="font-bold text-gray-800 mb-3"><i class="fas fa-info-circle text-purple-500 mr-2"></i>Specifications</h3>
                    <table class="w-full text-sm">
                        <tr class="border-b"><td class="py-2 text-gray-500">Category</td><td class="py-2 font-medium">${e.category}</td></tr>
                        <tr class="border-b"><td class="py-2 text-gray-500">Capacity</td><td class="py-2 font-medium">${e.capacity}</td></tr>
                        <tr class="border-b"><td class="py-2 text-gray-500">Material</td><td class="py-2 font-medium">${e.material}</td></tr>
                        <tr class="border-b"><td class="py-2 text-gray-500">Country</td><td class="py-2 font-medium">${e.country}</td></tr>
                        <tr class="border-b"><td class="py-2 text-gray-500">Lead Time</td><td class="py-2 font-medium">${e.leadTime}</td></tr>
                        <tr><td class="py-2 text-gray-500">Warranty</td><td class="py-2 font-medium">${e.warranty}</td></tr>
                    </table>
                </div>
                <div>
                    <h3 class="font-bold text-gray-800 mb-3"><i class="fas fa-star text-yellow-500 mr-2"></i>Features</h3>
                    <ul class="space-y-2">${e.features.map(f => `<li class="flex items-center gap-2 text-sm"><i class="fas fa-check text-green-500"></i> ${f}</li>`).join('')}</ul>
                    <h3 class="font-bold text-gray-800 mt-5 mb-3"><i class="fas fa-cogs text-blue-500 mr-2"></i>Applications</h3>
                    <div class="flex flex-wrap gap-2">${e.applications.map(a => `<span class="text-xs bg-blue-50 text-blue-700 px-2 py-1 rounded-full">${a}</span>`).join('')}</div>
                </div>
            </div>
            <div class="p-6 bg-gray-50 border-t">
                <div class="flex flex-wrap justify-between items-center gap-4">
                    <div>
                        <p class="text-sm text-gray-500">Price Range</p>
                        <p class="text-2xl font-bold text-purple-700">${fmtINR(e.priceMin)} - ${fmtINR(e.priceMax)}${e.unit || ''}</p>
                    </div>
                    <div class="flex gap-3">
                        <a href="tel:${e.contact}" class="btn-primary"><i class="fas fa-phone mr-2"></i>Call</a>
                        <a href="mailto:${e.email}" class="btn-primary bg-gradient-to-r from-green-500 to-emerald-600"><i class="fas fa-envelope mr-2"></i>Email</a>
                    </div>
                </div>
            </div>
        `;
        document.getElementById('detailModal').classList.remove('hidden');
        document.getElementById('detailModal').classList.add('flex');
    };
    window.closeDetail = () => { document.getElementById('detailModal').classList.add('hidden'); document.getElementById('detailModal').classList.remove('flex'); };
    function showCompare() {
        const items = selectedItems.map(id => EQUIPMENT_DB.find(e => e.id === id));
        const fmtINR = n => '₹' + n.toLocaleString('en-IN');
        const fields = [['Type', 'type'], ['Vendor', 'vendor'], ['Country', 'country'], ['Capacity', 'capacity'], ['Material', 'material'], ['Lead Time', 'leadTime'], ['Warranty', 'warranty'], ['Rating', 'rating']];
        let html = `<table class="w-full text-sm"><thead><tr class="bg-purple-50"><th class="py-3 px-4 text-left font-bold text-purple-700">Specification</th>${items.map(e => `<th class="py-3 px-4 text-left font-bold">${e.name}</th>`).join('')}</tr></thead><tbody>`;
        fields.forEach(([label, key]) => { html += `<tr class="border-b hover:bg-gray-50"><td class="py-3 px-4 font-medium text-gray-600">${label}</td>${items.map(e => `<td class="py-3 px-4">${e[key]}</td>`).join('')}</tr>`; });
        html += `<tr class="bg-green-50"><td class="py-3 px-4 font-bold text-green-700">Price Range</td>${items.map(e => `<td class="py-3 px-4 font-bold text-green-700">${fmtINR(e.priceMin)} - ${fmtINR(e.priceMax)}${e.unit || ''}</td>`).join('')}</tr>`;
        html += '</tbody></table>';
        document.getElementById('compareContent').innerHTML = html;
        document.getElementById('compareModal').classList.remove('hidden');
        document.getElementById('compareModal').classList.add('flex');
    }
    window.closeCompare = () => { document.getElementById('compareModal').classList.add('hidden'); document.getElementById('compareModal').classList.remove('flex'); };
    </script>
</body>
