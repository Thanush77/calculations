<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buffer & Equalization Optimizer</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --primary-color: #3b82f6;
            --primary-hover: #2563eb;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #334155;
            --text-light: #64748b;
            --border-color: #e2e8f0;
            --accent-orange: #f97316;
            --success-color: #10b981;
            --danger-color: #ef4444;
            --radius: 8px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            padding: 20px;
            color: var(--text-main);
            min-height: 100vh;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            border: 1px solid var(--border-color);
            overflow: hidden;
        }

        .header {
            padding: 25px;
            background: #fff;
            border-bottom: 1px solid var(--border-color);
            text-align: center;
        }

        h1 {
            font-size: 24px;
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 5px;
        }
        
        .subtitle { color: var(--text-light); font-size: 14px; }

        .main-content {
            padding: 25px;
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 25px;
        }

        /* Controls Panel */
        .controls-panel {
            background: #f8fafc;
            padding: 20px;
            border-radius: var(--radius);
            border: 1px solid var(--border-color);
            height: fit-content;
        }
        
        .section-header {
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            color: var(--text-light);
            margin-bottom: 15px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 5px;
            margin-top: 20px;
        }
        .section-header:first-child { margin-top: 0; }

        .form-group { margin-bottom: 15px; }
        .form-group label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 5px;
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 8px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 13px;
        }
        
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

        .btn-run {
            width: 100%;
            padding: 12px;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .btn-run:hover { background: var(--primary-hover); }

        /* Dashboard Area */
        .dashboard-area {
            display: grid;
            grid-template-rows: auto auto 1fr;
            gap: 20px;
        }

        /* KPI Cards */
        .kpi-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
        }
        .kpi-card {
            background: #fff;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 15px;
            text-align: center;
        }
        .kpi-val { font-size: 22px; font-weight: 800; color: #0f172a; margin: 5px 0; }
        .kpi-label { font-size: 11px; font-weight: 600; color: var(--text-light); text-transform: uppercase; }
        
        .risk-high { color: var(--danger-color); }
        .risk-warn { color: var(--accent-orange); }
        .risk-ok { color: var(--success-color); }

        /* Chart Container */
        .chart-container {
            background: #fff;
            padding: 20px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            height: 350px;
            position: relative;
        }
        
        /* Analysis Box */
        .analysis-box {
            background: #f0fdfa;
            border: 1px solid #ccfbf1;
            border-radius: 8px;
            padding: 20px;
            color: #115e59;
            font-size: 14px;
            line-height: 1.6;
        }
        .analysis-icon { font-size: 20px; margin-right: 10px; vertical-align: middle; }

        @media (max-width: 1100px) {
            .main-content { grid-template-columns: 1fr; }
            .kpi-grid { grid-template-columns: 1fr 1fr; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1><i class="fas fa-layer-group"></i> Buffer & Equalization Optimizer</h1>
            <p class="subtitle">Optimize Tank Volume for Peak Smoothing & Operational Stability</p>
        </div>

        <div class="main-content">
            <!-- Inputs -->
            <div class="controls-panel">
                <div class="section-header">Incoming Load Profile</div>
                <div class="form-group grid-2">
                    <div>
                        <label>Base Flow (m³/hr)</label>
                        <input type="number" id="baseFlow" value="30">
                    </div>
                    <div>
                        <label>Peak Factor</label>
                        <input type="number" id="peakFactor" value="2.0">
                    </div>
                </div>
                <div class="form-group p-desc">
                    <label>Peak Duration (hours)</label>
                    <input type="number" id="peakDur" value="4">
                    <small style="color:#94a3b8; font-size:11px;">Simulates burst event</small>
                </div>

                <div class="section-header">Tank Design</div>
                <div class="form-group grid-2">
                    <div>
                        <label>Buffer Vol (m³)</label>
                        <input type="number" id="tankVol" value="50">
                    </div>
                    <div>
                        <label>Mixer (kW/m³)</label>
                        <input type="number" id="mixPower" value="0.05">
                    </div>
                </div>

                <div class="section-header">Downstream System</div>
                <div class="form-group">
                    <label>Max Equipment Feed (m³/hr)</label>
                    <input type="number" id="maxFeed" value="40">
                </div>
                
                <div class="section-header">Cost Factors</div>
                 <div class="form-group grid-2">
                    <div>
                        <label>Energy ₹/kWh</label>
                         <input type="number" id="costKw" value="8">
                    </div>
                    <div>
                        <label>Poly ₹/kg</label>
                        <input type="number" id="costPoly" value="250">
                    </div>
                </div>

                <button class="btn-run" onclick="runOptimization()">
                    <i class="fas fa-bolt"></i> Run Optimization
                </button>
            </div>

            <!-- Dashboard -->
            <div class="dashboard-area">
                <!-- KPIs -->
                <div class="kpi-grid">
                    <div class="kpi-card">
                        <div class="kpi-label">Peak Reduction</div>
                        <div class="kpi-val" id="resPeakRed">-</div>
                    </div>
                    <div class="kpi-card">
                        <div class="kpi-label">Max Tank Usage</div>
                        <div class="kpi-val" id="resTankUse">-</div>
                    </div>
                    <div class="kpi-card">
                        <div class="kpi-label">Septicity Risk</div>
                        <div class="kpi-val" id="resSeptic">-</div>
                    </div>
                    <div class="kpi-card">
                        <div class="kpi-label">Est. Net Saving</div>
                        <div class="kpi-val" id="resSaving">-</div>
                    </div>
                </div>

                <!-- Chart -->
                <div class="chart-container">
                    <canvas id="simChart"></canvas>
                </div>

                <!-- Analysis -->
                <div class="analysis-box" id="analysisBox" style="display:none;">
                    <strong><i class="fas fa-lightbulb analysis-icon"></i> Optimizer Verdict:</strong><br>
                    <span id="analysisText"></span>
                </div>
            </div>
        </div>
    </div>

    <script>
        let myChart = null;

        function runOptimization() {
            // Inputs
            const baseQ = parseFloat(document.getElementById('baseFlow').value) || 0;
            const peakF = parseFloat(document.getElementById('peakFactor').value) || 1;
            const peakD = parseFloat(document.getElementById('peakDur').value) || 0;
            
            const vol = parseFloat(document.getElementById('tankVol').value) || 0;
            const powerMix = parseFloat(document.getElementById('mixPower').value) || 0;
            const maxOut = parseFloat(document.getElementById('maxFeed').value) || 9999;
            
            const costE = parseFloat(document.getElementById('costKw').value) || 0;
            const costP = parseFloat(document.getElementById('costPoly').value) || 0;

            // Sim 24h
            const hours = Array.from({length: 24}, (_, i) => i);
            const inflow = [];
            const outflow = [];
            const level = [];
            
            let currentVol = 0; // Starts empty
            let maxVolReached = 0;
            let overflowVol = 0;
            let totalIn = 0;
            
            hours.forEach(t => {
                // Generate Inflow: Peak typically mid-day. Let's start peak at t=8
                let qIn = baseQ;
                if(t >= 8 && t < (8+peakD)) {
                     qIn = baseQ * peakF;
                }
                
                totalIn += qIn;
                inflow.push(qIn);
                
                // Balance
                // Available to pump = currentVol + Inflow
                const potential = currentVol + qIn;
                
                // Outflow Logic: Pump constant rate if possible, up to maxOut.
                // Ideally, EQ tank pumps at Average Flow rate (Total/24).
                // Let's try to pump at 'Set Rate' = Avg Daily Flow of Profile.
                // Profile Avg = baseQ*24 + (baseQ*(peakF-1)*peakD) / 24... approx.
                // Or user defines 'Max Feed' as the pump setpoint? Ideally Max Feed is bottleneck.
                // Let's attempt to pump at `maxOut` whenever possible only if buffer needs emptying? 
                // NO, Equalization means Constant Flow. Let's aim for TotalIn / 24.
                // If Target > MaxOut, we are capped.
                
                const avgFlow = (baseQ * 24 + baseQ * (peakF - 1) * peakD) / 24;
                let targetOut = Math.min(avgFlow, maxOut);
                
                // But simplified for this tool: We try to discharge at TargetOut.
                let qOut = Math.min(potential, targetOut);
                
                // Update Buffer
                let nextVol = potential - qOut;
                
                // Overflow check
                if(nextVol > vol) {
                    overflowVol += (nextVol - vol);
                    nextVol = vol;
                    // If overflowing, implies our outflow wasn't enough or tank too small.
                    // Actually, if we overflow, it means Inflow > Outflow when full.
                    // Realistically, overflow bypasses buffer.
                }
                
                // Septicity check (Retention Time) during simulation? 
                // Avg RT = Vol / Flow. We'll verify later.
                
                outflow.push(qOut);
                level.push(nextVol);
                if(nextVol > maxVolReached) maxVolReached = nextVol;
                
                currentVol = nextVol;
            });
            
            // Peak Inflow
            const peakIn = baseQ * peakF;
            const peakOut = Math.max(...outflow);
            
            // KPIs
            const reduction = ((peakIn - peakOut) / peakIn) * 100;
            const tankUse = (maxVolReached / vol) * 100;
            
            // Septicity
            // Avg Level / Avg Flow
            const avgLvl = level.reduce((a,b)=>a+b,0) / 24;
            const avgQ = outflow.reduce((a,b)=>a+b,0) / 24;
            const rt = (avgQ > 0) ? (avgLvl / avgQ) : 0;
            
            // Financials (Estimation)
            // Buffer Mixing Cost
            const mixKw = vol * powerMix;
            const mixCost = mixKw * 24 * 330 * costE;
            
            // Savings from Peak Reduction?
            // Assume "Stability Bonus": 10% polymer reduction if flow varies < 10%
            // Flow Variation: (Max - Min)/Avg
            const flowVar = (Math.max(...outflow) - Math.min(...outflow)) / avgQ;
            let polySave = 0;
            
            if(flowVar < 0.2) {
                // Stable! 
                // Base Poly Cost approx: 5 g/m3 (just guess for savings calc)?
                // Let's say we save ₹Lakhs/yr. 
                // User didn't input load, just flow. Assume 0.3 kg/m3 TSS for saving calc?
                // Let's simplify: Arbitrary 'Stability Value' = ₹100 per m3 smoothed?
                // Or just show "Qualitative". 
                // Let's use heuristic: 15% Poly saving. 
                // Assume Poly Cost = ₹5 Lakhs/yr base.
                // Let's just output Mix Cost vs Benefit logic in verdict.
                // Or better: Display Mixing Cost specifically.
            }
            
            // Render
            document.getElementById('resPeakRed').textContent = reduction.toFixed(1) + "%";
            document.getElementById('resTankUse').textContent = tankUse.toFixed(0) + "%";
            document.getElementById('resTankUse').className = (overflowVol > 0) ? 'kpi-val risk-high' : 'kpi-val';
            if(overflowVol > 0) document.getElementById('resTankUse').textContent = "OVERFLOW";
            
            document.getElementById('resSeptic').textContent = rt.toFixed(1) + " hrs";
            document.getElementById('resSeptic').className = (rt > 6) ? 'kpi-val risk-warn' : 'kpi-val risk-ok';
            
            // Savings display: Show Mixing Cost
            document.getElementById('resSaving').textContent = "-" + (mixCost/100000).toFixed(1) + " L/yr (Mix)";
            
            renderChart(hours, inflow, outflow, level);
            
            // Analysis
            const box = document.getElementById('analysisBox');
            const txt = document.getElementById('analysisText');
            box.style.display = 'block';
            
            let msg = "";
            if(overflowVol > 0) {
                msg = `CRITICAL: Tank capacity is insufficient. <strong>${overflowVol.toFixed(1)} m³ of sludge overflowed</strong> during the peak event. Increase volume or outflow rate.`;
                box.style.borderColor = '#ef4444';
                box.style.background = '#fef2f2';
                box.style.color = '#991b1b';
            } else if(rt > 12) {
                msg = `WARNING: Retention time (${rt.toFixed(1)}h) is too high. High risk of septicity and odors. Reduce tank size or increase throughput to maintain <6h retention.`;
                 box.style.borderColor = '#f97316';
                 box.style.color = '#9a3412';
            } else {
                msg = `OPTIMAL: Buffer absorbs the peak event successfully (Reducing Flow Spike by ${reduction.toFixed(0)}%). Downstream equipment sees a stable load, improving polymer efficiency. Mixing OPEX is ₹${(mixCost/100000).toFixed(2)} Lakh/yr.`;
                 box.style.borderColor = '#10b981';
                 box.style.background = '#f0fdf4';
                 box.style.color = '#065f46';
            }
            txt.innerHTML = msg;
        }

        function renderChart(labels, inflow, outflow, level) {
            const ctx = document.getElementById('simChart').getContext('2d');
            if(myChart) myChart.destroy();

            myChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels.map(h => `${h}:00`),
                    datasets: [
                        {
                            type: 'line',
                            label: 'Buffer Level (m³)',
                            data: level,
                            borderColor: '#8b5cf6',
                            borderWidth: 2,
                            yAxisID: 'y1',
                            fill: true,
                            backgroundColor: 'rgba(139, 92, 246, 0.1)',
                            tension: 0.4
                        },
                        {
                            type: 'line',
                            label: 'Inflow (m³/hr)',
                            data: inflow,
                            borderColor: '#ef4444',
                            borderDash: [5,5],
                            borderWidth: 2,
                            yAxisID: 'y',
                            fill: false
                        },
                        {
                            type: 'line',
                            label: 'Outflow (m³/hr)',
                            data: outflow,
                            borderColor: '#10b981',
                            borderWidth: 2,
                            yAxisID: 'y',
                            fill: false
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    interaction: { mode: 'index', intersect: false },
                    scales: {
                        y: {
                            type: 'linear',
                            display: true,
                            position: 'left',
                            title: { display: true, text: 'Flow Rate (m³/hr)' }
                        },
                        y1: {
                            type: 'linear',
                            display: true,
                            position: 'right',
                            grid: { drawOnChartArea: false },
                            title: { display: true, text: 'Tank Volume (m³)' }
                        }
                    }
                }
            });
        }
    </script>
</body>
</html>
