<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pump Equipment Foundation Calculator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            background: linear-gradient(135deg, #2c5aa0 0%, #1e3c72 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #2c5aa0 0%, #1e3c72 100%);
            color: white;
            text-align: center;
            padding: 30px;
        }

        .header h1 {
            font-size: 32px;
            font-weight: 700;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
        }

        .content {
            padding: 40px;
        }

        .calculator-section {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 30px;
            border-left: 4px solid #2c5aa0;
        }

        .section-title {
            font-size: 24px;
            font-weight: 700;
            color: #2c3e50;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 25px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group.full-width {
            grid-column: 1 / -1;
        }

        label {
            font-size: 16px;
            font-weight: 600;
            color: #34495e;
            margin-bottom: 8px;
        }

        input[type="number"] {
            padding: 12px 16px;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            font-size: 16px;
            transition: all 0.3s ease;
            background-color: #ffd700;
        }

        input[type="number"]:focus {
            outline: none;
            border-color: #2c5aa0;
            box-shadow: 0 0 0 3px rgba(44, 90, 160, 0.1);
        }

        input[type="number"].result {
            background-color: #90ee90;
            font-weight: 600;
            color: #2c3e50;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        input[type="checkbox"] {
            width: 20px;
            height: 20px;
            cursor: pointer;
        }

        .checkbox-group label {
            margin: 0;
            cursor: pointer;
        }

        .calculate-btn {
            background: linear-gradient(135deg, #2c5aa0 0%, #1e3c72 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(44, 90, 160, 0.3);
        }

        .calculate-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(44, 90, 160, 0.4);
        }

        .icon {
            font-size: 20px;
            color: #2c5aa0;
        }

        @media (max-width: 768px) {
            .form-grid {
                grid-template-columns: 1fr;
            }

            .content {
                padding: 20px;
            }

            .header h1 {
                font-size: 24px;
            }

            .section-title {
                font-size: 20px;
            }
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Pump Equipment Foundation Calculator</h1>
        </div>

        <div class="content">
            <!-- Centrifugal Pump Section -->
            <div class="calculator-section">
                <h2 class="section-title">
                    <i class="fas fa-sync-alt icon"></i>
                    Centrifugal Pump Calculation
                </h2>

                <div class="form-grid">
                    <div class="form-group">
                        <label for="cent-puddle-height">Tank Bottom of the Puddle Height (mm):</label>
                        <input type="number" id="cent-puddle-height" step="1" placeholder="Enter puddle height">
                    </div>

                    <div class="form-group">
                        <label for="cent-puddle-size">Puddle Size (mm):</label>
                        <input type="number" id="cent-puddle-size" step="1" placeholder="Enter puddle size">
                    </div>

                    <div class="form-group">
                        <label for="cent-pump-height">Pump Height from Center to Base (mm):</label>
                        <input type="number" id="cent-pump-height" step="1" placeholder="Enter pump height">
                    </div>

                    <div class="form-group">
                        <label for="cent-foundation-height">Foundation Height (mm):</label>
                        <input type="number" id="cent-foundation-height" class="result" readonly>
                    </div>
                </div>

                <button class="calculate-btn" onclick="calculateCentrifugal()">
                    <i class="fas fa-calculator"></i>
                    Calculate Centrifugal
                </button>
            </div>

            <!-- Screw Pump Section -->
            <div class="calculator-section">
                <h2 class="section-title">
                    <i class="fas fa-cogs icon"></i>
                    Screw Pump Calculation
                </h2>

                <div class="form-grid">
                    <div class="form-group">
                        <label for="screw-puddle-height">Tank Bottom of the Puddle Height (mm):</label>
                        <input type="number" id="screw-puddle-height" step="1" placeholder="Enter puddle height">
                    </div>

                    <div class="form-group">
                        <label for="screw-puddle-size">Puddle Size (mm):</label>
                        <input type="number" id="screw-puddle-size" step="1" placeholder="Enter puddle size">
                    </div>

                    <div class="form-group">
                        <label for="screw-pump-height">Pump Height from Center to Base (mm):</label>
                        <input type="number" id="screw-pump-height" step="1" placeholder="Enter pump height">
                    </div>

                    <div class="form-group">
                        <label for="screw-foundation-height">Foundation Height (mm):</label>
                        <input type="number" id="screw-foundation-height" class="result" readonly>
                    </div>

                    <div class="form-group full-width">
                        <div class="checkbox-group">
                            <input type="checkbox" id="include-elbow" checked>
                            <label for="include-elbow">Include Elbow?</label>
                        </div>
                    </div>
                </div>

                <button class="calculate-btn" onclick="calculateScrew()">
                    <i class="fas fa-calculator"></i>
                    Calculate Screw
                </button>
            </div>
        </div>
    </div>

    <script>
        function calculateCentrifugal() {
            // Get input values
            const puddleHeight = parseFloat(document.getElementById('cent-puddle-height').value) || 0;
            const puddleSize = parseFloat(document.getElementById('cent-puddle-size').value) || 0;
            const pumpHeight = parseFloat(document.getElementById('cent-pump-height').value) || 0;

            // Calculate foundation height for centrifugal pump
            // Formula: Foundation Height = Puddle Height + Puddle Size + Pump Height + Safety Factor
            const safetyFactor = 100; // 100mm safety factor
            const foundationHeight = puddleHeight + puddleSize + pumpHeight + safetyFactor;

            // Display result
            document.getElementById('cent-foundation-height').value = Math.round(foundationHeight);
        }

        function calculateScrew() {
            // Get input values
            const puddleHeight = parseFloat(document.getElementById('screw-puddle-height').value) || 0;
            const puddleSize = parseFloat(document.getElementById('screw-puddle-size').value) || 0;
            const pumpHeight = parseFloat(document.getElementById('screw-pump-height').value) || 0;
            const includeElbow = document.getElementById('include-elbow').checked;

            // Calculate foundation height for screw pump
            let foundationHeight = puddleHeight + puddleSize + pumpHeight;
            
            // Add elbow clearance if selected
            if (includeElbow) {
                foundationHeight += 150; // Additional 150mm for elbow clearance
            }
            
            // Add safety factor
            const safetyFactor = 100; // 100mm safety factor
            foundationHeight += safetyFactor;

            // Display result
            document.getElementById('screw-foundation-height').value = Math.round(foundationHeight);
        }

        // Auto-calculate when values change
        document.addEventListener('input', function(e) {
            if (e.target.type === 'number') {
                const section = e.target.id.split('-')[0];
                if (section === 'cent') {
                    calculateCentrifugal();
                } else if (section === 'screw') {
                    calculateScrew();
                }
            }
        });

        // Auto-calculate when checkbox changes
        document.getElementById('include-elbow').addEventListener('change', calculateScrew);
    </script>
</body>
</html>
