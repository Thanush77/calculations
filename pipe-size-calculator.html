<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pipe Size Calculator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            background: linear-gradient(135deg, #e3f2fd 0%, #bbdefb 100%);
            padding: 20px;
            min-height: 100vh;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            color: #1976d2;
            font-size: 28px;
            font-weight: 600;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        }

        .container {
            background: white;
            border-radius: 12px;
            padding: 40px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
            max-width: 500px;
            margin: 0 auto;
        }

        h1 {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 30px;
            color: #333;
        }

        .form-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            font-size: 16px;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
        }

        input[type="number"], select {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s, box-shadow 0.3s;
            background-color: white;
        }

        input[type="number"]:focus, select:focus {
            outline: none;
            border-color: #1976d2;
            box-shadow: 0 0 0 3px rgba(25, 118, 210, 0.1);
        }

        select {
            cursor: pointer;
        }

        input::placeholder {
            color: #aaa;
            font-style: italic;
        }

        .calculate-btn {
            width: 100%;
            background: linear-gradient(135deg, #4caf50 0%, #45a049 100%);
            color: white;
            border: none;
            padding: 16px;
            font-size: 18px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.3s;
            margin-top: 20px;
        }

        .calculate-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(76, 175, 80, 0.3);
        }

        .calculate-btn:active {
            transform: translateY(0);
        }

        .results {
            margin-top: 30px;
            padding: 25px;
            background: linear-gradient(135deg, #e8f5e8 0%, #f1f8e9 100%);
            border-radius: 8px;
            border-left: 4px solid #4caf50;
            display: none;
        }

        .result-item {
            font-size: 18px;
            margin-bottom: 15px;
            color: #333;
        }

        .result-value {
            font-weight: 600;
            color: #2e7d32;
        }

        @media (max-width: 600px) {
            .container {
                padding: 30px 20px;
            }

            .header {
                font-size: 24px;
            }

            h1 {
                font-size: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="header">PIPE SIZE CALCULATOR</div>
    
    <div class="container">
        <h1>Line Sizing Calculator</h1>
        
        <form id="pipeForm">
            <div class="form-group">
                <label for="flowRate">Flow Rate (m³/h):</label>
                <input type="number" id="flowRate" placeholder="Enter flow rate in m³/h" step="0.1" required>
            </div>
            
            <div class="form-group">
                <label for="velocity">Select Velocity:</label>
                <select id="velocity" required>
                    <option value="">Select velocity type</option>
                    <option value="gravity">Gravity (0.5-1.5 m/s)</option>
                    <option value="suction">Suction (1.0-2.0 m/s)</option>
                    <option value="discharge">Discharge (1.5-3.0 m/s)</option>
                    <option value="steam">Steam (15-30 m/s)</option>
                    <option value="compressed_air">Compressed Air (10-25 m/s)</option>
                    <option value="water_service">Water Service (1.0-2.5 m/s)</option>
                </select>
            </div>
            
            <button type="button" class="calculate-btn" onclick="calculateDiameter()">Calculate Diameter</button>
        </form>
        
        <div class="results" id="results">
            <div class="result-item">
                Recommended Velocity Range: <span class="result-value" id="velocityRange">0.00 - 0.00 m/s</span>
            </div>
            <div class="result-item">
                Calculated Diameter (min): <span class="result-value" id="diameterMin">0.00 mm</span>
            </div>
            <div class="result-item">
                Calculated Diameter (max): <span class="result-value" id="diameterMax">0.00 mm</span>
            </div>
            <div class="result-item">
                Recommended Pipe Size: <span class="result-value" id="recommendedSize">DN 00</span>
            </div>
        </div>
    </div>

    <script>
        // Velocity ranges for different applications
        const velocityRanges = {
            'gravity': { min: 0.5, max: 1.5, name: '0.5 - 1.5 m/s' },
            'suction': { min: 1.0, max: 2.0, name: '1.0 - 2.0 m/s' },
            'discharge': { min: 1.5, max: 3.0, name: '1.5 - 3.0 m/s' },
            'steam': { min: 15, max: 30, name: '15 - 30 m/s' },
            'compressed_air': { min: 10, max: 25, name: '10 - 25 m/s' },
            'water_service': { min: 1.0, max: 2.5, name: '1.0 - 2.5 m/s' }
        };

        // Standard pipe sizes (DN - Nominal Diameter in mm)
        const standardPipeSizes = [
            15, 20, 25, 32, 40, 50, 65, 80, 100, 125, 150, 200, 250, 300, 350, 400, 450, 500, 600, 700, 800, 900, 1000
        ];

        function calculateDiameter() {
            const flowRate = parseFloat(document.getElementById('flowRate').value);
            const velocityType = document.getElementById('velocity').value;

            if (!flowRate || !velocityType) {
                alert('Please enter all required values.');
                return;
            }

            const velocityRange = velocityRanges[velocityType];
            const flowRateMs = flowRate / 3600; // Convert m³/h to m³/s

            // Calculate diameter using: D = sqrt(4Q / (π × V))
            // For minimum diameter (maximum velocity)
            const diameterMinM = Math.sqrt((4 * flowRateMs) / (Math.PI * velocityRange.max));
            const diameterMinMm = diameterMinM * 1000;

            // For maximum diameter (minimum velocity)
            const diameterMaxM = Math.sqrt((4 * flowRateMs) / (Math.PI * velocityRange.min));
            const diameterMaxMm = diameterMaxM * 1000;

            // Find recommended standard pipe size
            let recommendedSize = standardPipeSizes[0];
            for (let size of standardPipeSizes) {
                if (size >= diameterMinMm) {
                    recommendedSize = size;
                    break;
                }
            }

            // Update results
            document.getElementById('velocityRange').textContent = velocityRange.name;
            document.getElementById('diameterMin').textContent = diameterMinMm.toFixed(1) + ' mm';
            document.getElementById('diameterMax').textContent = diameterMaxMm.toFixed(1) + ' mm';
            document.getElementById('recommendedSize').textContent = 'DN ' + recommendedSize;

            document.getElementById('results').style.display = 'block';
        }

        // Add enter key support
        document.addEventListener('keypress', function(event) {
            if (event.key === 'Enter') {
                calculateDiameter();
            }
        });
    </script>
</body>
</html>
